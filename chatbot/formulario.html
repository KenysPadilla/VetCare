<html lang="es">
<head>

  <title>Solicitar Cita — Clinica Veterinaria VetCare</title>

  <!-- Flatpickr — calendario visual -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0d1f2b 0%, #1a3d52 60%, #0d1f2b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.35);
      width: 100%;
      max-width: 560px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #2b87a0, #1e6677);
      color: #fff;
      padding: 20px 24px 18px;
      text-align: left;
    }

    .card-header .logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .card-header .logo span { color: #a8d8e8; }

    .card-header p {
      margin-top: 6px;
      font-size: 0.9rem;
      opacity: 0.88;
    }

    .card-body { padding: 28px 32px 32px; }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 14px;
    }

    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #1a2e3b;
      margin-bottom: 5px;
    }

    input, select, textarea {
      border: 1.5px solid #c8dde8;
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.92rem;
      font-family: inherit;
      color: #222;
      outline: none;
      transition: border-color 0.2s;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      border-color: #2b87a0;
    }

    textarea { resize: vertical; min-height: 80px; }

    /* Horas disponibles */
    .horas-section { margin-bottom: 14px; }

    .horas-section .label-horas {
      font-size: 0.82rem;
      font-weight: 600;
      color: #1a2e3b;
      margin-bottom: 8px;
    }

    .horas-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .hora-btn {
      background: #eef7fa;
      border: 1.5px solid #2b87a0;
      color: #2b87a0;
      border-radius: 6px;
      padding: 6px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }

    .hora-btn:hover { background: #d0e8f0; }

    .hora-btn.selected {
      background: #2b87a0;
      color: #fff;
    }

    .horas-mensaje {
      font-size: 0.85rem;
      color: #888;
      font-style: italic;
    }

    /* Boton enviar */
    .btn-submit {
      width: 100%;
      background: #2b87a0;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
      letter-spacing: 0.5px;
    }

    .btn-submit:hover:not(:disabled) { background: #1e6677; }
    .btn-submit:disabled { background: #8ab8c7; cursor: not-allowed; }

    /* Mensajes de estado */
    .msg {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 0.88rem;
      display: none;
    }

    .msg.success { background: #e8f4f8; color: #2b87a0; border: 1px solid #bee3ef; display: block; }
    .msg.error   { background: #fdecea; color: #c62828; border: 1px solid #ef9a9a; display: block; }
    .msg.info    { background: #e3f2fd; color: #1565c0; border: 1px solid #90caf9; display: block; }

    /* Horario pié */
    .footer-note {
      text-align: center;
      font-size: 0.78rem;
      color: #888;
      margin-top: 20px;
    }

    /* Autocomplete raza */
    .autocomplete-wrap { position: relative; }
    .autocomplete-list {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
      background: #fff; border: 1.5px solid #2b87a0; border-top: none;
      border-radius: 0 0 8px 8px; max-height: 200px; overflow-y: auto;
      display: none; box-shadow: 0 6px 16px rgba(0,0,0,0.12);
    }
    .autocomplete-item {
      padding: 9px 12px; cursor: pointer; font-size: 0.9rem; color: #222;
      transition: background 0.15s;

    .autocomplete-item:hover { background: #eef7fa; color: #2b87a0; }
    .autocomplete-item.item-otra {
      font-weight: 700; color: #2b87a0; border-top: 1px solid #e0ecf0;
      font-style: italic;
    }

    @media (max-width: 480px) {
      .form-row { grid-template-columns: 1fr; }
      .card-body { padding: 20px 18px 24px; }
      .card-header { padding: 22px 18px 16px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="card-header">
    <div style="display:flex;align-items:center;gap:14px;">
      <img src="images/logo-white.png" alt="VetCare" style="width:52px;height:52px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 6px rgba(0,0,0,0.25));">
      <div>
        <div style="font-size:1.4rem;font-weight:800;letter-spacing:1px;color:#fff;line-height:1.1;">Solicitud de Cita</div>
        <div style="font-size:0.82rem;color:#a8d8e8;margin-top:5px;letter-spacing:0.3px;font-weight:500;">Clínica Veterinaria VetCare &bull; En línea</div>
      </div>
    </div>
  </div>

  <div class="card-body">
    <form id="formCita" novalidate>

      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre completo del propietario *</label>
          <input type="text" id="nombre" placeholder="Ej. Maria Garcia" required />
        </div>
        <div class="form-group">
          <label for="telefono">Telefono de contacto *</label>
          <input type="tel" id="telefono" placeholder="Ej. 3001234567" required />
        </div>
      </div>

      <div class="form-group">
        <label for="correo">Correo electronico *</label>
        <input type="email" id="correo" placeholder="tu@correo.com" required />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="nombreMascota">Nombre de la mascota *</label>
          <input type="text" id="nombreMascota" placeholder="Ej. Luna" required />
        </div>
        <div class="form-group">
          <label for="especieInput">Especie *</label>
          <div class="autocomplete-wrap" id="especieWrap">
            <input type="text" id="especieInput" placeholder="Escribe para buscar especie..." autocomplete="off" />
            <div class="autocomplete-list" id="especieList"></div>
          </div>
          <input type="hidden" id="especie" />
        </div>
      </div>

      <div class="form-group" id="grupoEspecieOtro" style="display:none;">
        <label for="especieOtro">Especifica la especie *</label>
        <input type="text" id="especieOtro" placeholder="Ej. Hamster, Tortuga, Conejo..." />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="razaInput">Raza de la mascota</label>
          <div class="autocomplete-wrap" id="razaWrap">
            <input type="text" id="razaInput" placeholder="Escribe para buscar raza..." autocomplete="off" />
            <div class="autocomplete-list" id="razaList"></div>
          </div>
        </div>
        <div class="form-group">
          <label for="sexo">Sexo *</label>
          <select id="sexo" required>
            <option value="">Selecciona...</option>
            <option value="Macho">Macho</option>
            <option value="Hembra">Hembra</option>
            <option value="Desconocido">Desconocido</option>
          </select>
        </div>
      </div>
      <div class="form-group" id="grupoRazaOtra" style="display:none;">
        <label for="razaOtra">Especifica la raza *</label>
        <input type="text" id="razaOtra" placeholder="Ej. Criollo, Mestizo especial..." />
      </div>

      <div class="form-group">
        <label for="fecha">Fecha de la cita *</label>
        <input type="text" id="fecha" placeholder="Selecciona una fecha..." readonly required />
      </div>

      <!-- Horas disponibles — aparece tras elegir fecha -->
      <div class="horas-section" id="seccionHoras" style="display:none;">
        <div class="label-horas">Hora disponible *</div>
        <div class="horas-grid" id="horasGrid"></div>
      </div>

      <div class="form-group" style="margin-top:14px;">
        <label for="motivo">Motivo de la consulta *</label>
        <textarea id="motivo" placeholder="Describe brevemente el motivo de la visita..." required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnEnviar">Solicitar Cita</button>

    </form>

    <div class="msg" id="msgEstado"></div>

    <p class="footer-note">
      Horario: Lun&ndash;Vie 8:00&ndash;18:00 &bull; Sab 8:00&ndash;12:00<br />
      Contacto: <strong>3001234567</strong>
    </p>
  </div>
</div>

<script>
  // ═══════════════════════════════════════════════════════════════════
  //  CONFIGURACION DE FIREBASE WEB SDK
  //  Reemplaza cada valor con los datos de tu proyecto:
  //  Firebase Console > Configuracion del proyecto > Tus apps > Web
  // ═══════════════════════════════════════════════════════════════════
  const firebaseConfig = {
    apiKey:            "AIzaSyD6LiknqD_kUVHadd6XMstM4QmL1TETD3Y",
    authDomain:        "vetcare-solicitudcitas.firebaseapp.com",
    databaseURL:       "https://vetcare-solicitudcitas-default-rtdb.firebaseio.com",
    projectId:         "vetcare-solicitudcitas",
    storageBucket:     "vetcare-solicitudcitas.firebasestorage.app",
    messagingSenderId: "353962398721",
    appId:             "1:353962398721:web:f7430d8f3db34ffbba9c00"
  };

  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // ═══════════════════════════════════════════════════════════════════
  //  Horario base de la clinica
  // ═══════════════════════════════════════════════════════════════════
  const HORARIO = {
    // Lunes (1) a Viernes (5) — intervalos de 30 min
    semana: ["08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30",
             "12:00","12:30","14:00","14:30","15:00","15:30","16:00","16:30","17:00","17:30"],
    // Sabado (6) — intervalos de 30 min
    sabado: ["08:00","08:30","09:00","09:30","10:00","10:30","11:00","11:30"]
  };

  let horaSeleccionada = null;

  // ── Lista de especies ───────────────────────────────────────────────
  const TODAS_LAS_ESPECIES = [
    "Perro","Gato","Conejo","Hámster Dorado","Hámster Ruso","Cobaya / Cuy",
    "Chinchilla","Hurón","Rata Doméstica","Ratón Doméstico","Erizo Africano",
    "Degú","Jerbo","Mini Pig",
    "Ave","Loro / Papagayo","Periquito / Perico","Canario","Cacatúa",
    "Guacamayo","Agapornis","Cotorra",
    "Reptil","Iguana","Tortuga","Serpiente","Gecko","Camaleón",
    "Pez","Otro"
  ];

  // ── Autocomplete de especie ─────────────────────────────────────────
  (function initEspecieAutocomplete() {
    const input = document.getElementById("especieInput");
    const lista = document.getElementById("especieList");
    const hidden = document.getElementById("especie");

    function onEspecieSeleccionada(valor) {
      input.value = valor;
      hidden.value = valor;
      lista.style.display = "none";
      // Mostrar / ocultar campo especie libre
      const grupo = document.getElementById("grupoEspecieOtro");
      const otraInput = document.getElementById("especieOtro");
      if (valor === "Otro") {
        grupo.style.display = "flex";
        otraInput.required = true;
      } else {
        grupo.style.display = "none";
        otraInput.required = false;
        otraInput.value = "";
      }
      // Resetear raza al cambiar especie
      document.getElementById("razaInput").value = "";
      document.getElementById("razaList").style.display = "none";
      document.getElementById("grupoRazaOtra").style.display = "none";
      document.getElementById("razaOtra").value = "";
    }

    function renderEspecies(filtro) {
      const lower = filtro.toLowerCase();
      const matches = filtro
        ? TODAS_LAS_ESPECIES.filter(e => e.toLowerCase().includes(lower))
        : TODAS_LAS_ESPECIES;
      lista.innerHTML = "";
      if (!matches.length) { lista.style.display = "none"; return; }
      matches.forEach(e => {
        const div = document.createElement("div");
        div.className = "autocomplete-item" + (e === "Otro" ? " item-otra" : "");
        div.textContent = e;
        div.addEventListener("mousedown", ev => { ev.preventDefault(); onEspecieSeleccionada(e); });
        lista.appendChild(div);
      });
      lista.style.display = "block";
    }

    input.addEventListener("input",  () => { hidden.value = ""; renderEspecies(input.value); });
    input.addEventListener("focus",  () => renderEspecies(input.value));
    input.addEventListener("blur",   () => setTimeout(() => lista.style.display = "none", 150));
    document.addEventListener("click", e => {
      if (!document.getElementById("especieWrap").contains(e.target))
        lista.style.display = "none";
    });
  })();

  // ═══════════════════════════════════════════════════════════════════
  //  Flatpickr — calendario visual
  // ═══════════════════════════════════════════════════════════════════
  flatpickr("#fecha", {
    locale: "es",
    minDate: new Date(new Date().setDate(new Date().getDate() + 1)),
    disable: [
      // Deshabilitar domingos (0 = domingo en Flatpickr)
      function(date) { return date.getDay() === 0; }
    ],
    dateFormat: "Y-m-d",
    onChange: function(selectedDates, dateStr) {
      horaSeleccionada = null;
      cargarHorasDisponibles(dateStr);
    }
  });

  // ═══════════════════════════════════════════════════════════════════
  //  Autocomplete de raza (filtrado por especie)
  // ═══════════════════════════════════════════════════════════════════
  const RAZAS_POR_ESPECIE = {
    Perro: [
      "Labrador Retriever","Golden Retriever","Pastor Alemán","Bulldog Francés",
      "Bulldog Inglés","French Poodle","Beagle","Rottweiler","Yorkshire Terrier",
      "Chihuahua","Dachshund / Teckel","Boxer","Doberman Pinscher","Husky Siberiano",
      "Border Collie","Cocker Spaniel Inglés","Cocker Spaniel Americano",
      "Shih Tzu","Maltés","Pomerania / Spitz","Schnauzer Miniatura",
      "Schnauzer Estándar","Schnauzer Gigante","Pit Bull Terrier","American Bully",
      "Dálmata","Shar-Pei","Akita Inu","Shiba Inu","Bichón Frisé","Gran Danés",
      "Samoyedo","Alaskan Malamute","Jack Russell Terrier","Pug / Carlino",
      "Basset Hound","Chow Chow","Weimaraner","Australian Shepherd",
      "Australian Cattle Dog","Bernese Mountain Dog","Cavalier King Charles Spaniel",
      "Springer Spaniel Inglés","Setter Irlandés","Setter Inglés",
      "Bull Terrier","Staffordshire Bull Terrier","American Staffordshire Terrier",
      "Airedale Terrier","West Highland White Terrier","Cairn Terrier",
      "Scottish Terrier","Fox Terrier Pelo Liso","Fox Terrier Pelo Duro",
      "Border Terrier","Welsh Corgi Pembroke","Welsh Corgi Cardigan",
      "Rough Collie","Shetland Sheepdog","Old English Sheepdog","Lhasa Apso",
      "Pekingés","Cane Corso","Dogo Argentino","Fila Brasileño","Boerboel",
      "Mastín Napolitano","Mastín Inglés","Mastín Tibetano",
      "Pastor Belga Malinois","Pastor Belga Tervuren","Pastor Blanco Suizo",
      "Rhodesian Ridgeback","Greyhound / Galgo","Whippet","Afghan Hound",
      "Saluki","Irish Wolfhound","Borzoi","Vizsla Húngaro","Braco Alemán",
      "Nova Scotia Duck Tolling Retriever","Flat-Coated Retriever",
      "Chesapeake Bay Retriever","Irish Water Spaniel",
      "Newfoundland / Terranova","San Bernardo","Leonberger",
      "Miniature Pinscher","Maltipoo","Labradoodle","Goldendoodle","Cockapoo",
      "Havanés","Coton de Tuléar","Bichón Habanero","Perro de Agua Español",
      "Cimarrón Uruguayo","Galgo Español","Podenco Ibicenco",
      "Perro Sin Pelo del Perú","Xoloitzcuintle","Spitz Japonés",
      "Mestizo","Otra"
    ],
    Gato: [
      "Persa","Siamés","Maine Coon","Ragdoll","Bengalí","British Shorthair",
      "Abisinio","Sphynx","Scottish Fold","Birmano","Angora Turco",
      "Azul Ruso","Devon Rex","Cornish Rex","Selkirk Rex",
      "American Shorthair","American Curl","Noruego del Bosque",
      "Siberiano","Bombay","Burmés","Tonkinés","Ocicat",
      "Mau Egipcio","Balinés","Turkish Van","Somali",
      "Chartreux","Manx","Singapura","Javanés",
      "Mestizo","Otra"
    ],
    Ave: [
      "Periquito Australiano","Periquito Americano","Canario",
      "Loro Amazónico","Loro Gris Africano","Cacatúa",
      "Cacatúa Ninfa / Cockatiel","Agapornis","Guacamayo Azul y Amarillo",
      "Guacamayo Rojo","Guacamayo Verde","Cotorra","Perico",
      "Tucán","Paloma","Jilguero","Pinzón","Mirlo","Otra"
    ],
    Reptil: [
      "Iguana Verde","Iguana Rinoceronte","Gecko Leopardo","Gecko de Cresta",
      "Camaleón Velado","Tortuga de Tierra","Tortuga Acuática",
      "Tortuga Mediterránea","Boa Constrictor","Serpiente Maíz",
      "Dragón Barbudo","Lagartija de Jardín","Monitor de Savana",
      "Pitón Bola","Otra"
    ],
    Otro: [
      "Hámster Dorado","Hámster Ruso","Hámster Chino",
      "Conejo","Cobaya / Cuy","Ratón Doméstico","Rata Doméstica",
      "Hurón","Chinchilla","Erizo Africano","Jerbo","Degú",
      "Mestizo","Otra"
    ]
  };

  function getRazasActuales() {
    const esp = document.getElementById("especie").value;
    if (!esp || esp === "Otro") return [...new Set(Object.values(RAZAS_POR_ESPECIE).flat())];
    if (RAZAS_POR_ESPECIE[esp]) return RAZAS_POR_ESPECIE[esp];
    const AVES     = ["Loro / Papagayo","Periquito / Perico","Canario","Cacatúa","Guacamayo","Agapornis","Cotorra"];
    const REPTILES = ["Iguana","Tortuga","Serpiente","Gecko","Camaleón"];
    const OTROS    = ["Conejo","Hámster Dorado","Hámster Ruso","Cobaya / Cuy","Chinchilla",
                      "Hurón","Rata Doméstica","Ratón Doméstico","Erizo Africano","Degú","Jerbo","Mini Pig"];
    if (AVES.includes(esp))    return RAZAS_POR_ESPECIE.Ave;
    if (REPTILES.includes(esp)) return RAZAS_POR_ESPECIE.Reptil;
    if (OTROS.includes(esp))   return RAZAS_POR_ESPECIE.Otro;
    return [...new Set(Object.values(RAZAS_POR_ESPECIE).flat())];
  }

  (function initRazaAutocomplete() {
    const input  = document.getElementById("razaInput");
    const lista  = document.getElementById("razaList");

    function renderLista(filtro) {
      const razas    = getRazasActuales();
      const lower    = filtro.toLowerCase();
      const matches  = filtro
        ? razas.filter(r => r.toLowerCase().includes(lower))
        : razas;

      lista.innerHTML = "";
      if (!matches.length) { lista.style.display = "none"; return; }

      matches.forEach(r => {
        const div = document.createElement("div");
        div.className = "autocomplete-item" + (r === "Otra" ? " item-otra" : "");
        div.textContent = r;
        div.addEventListener("mousedown", e => {
          e.preventDefault();
          input.value = r;
          lista.style.display = "none";
          const grupoOtra = document.getElementById("grupoRazaOtra");
          if (r === "Otra") {
            grupoOtra.style.display = "flex";
            document.getElementById("razaOtra").required = true;
          } else {
            grupoOtra.style.display = "none";
            document.getElementById("razaOtra").required = false;
            document.getElementById("razaOtra").value = "";
          }
        });
        lista.appendChild(div);
      });
      lista.style.display = "block";
    }

    input.addEventListener("input",  () => renderLista(input.value));
    input.addEventListener("focus",  () => renderLista(input.value));
    input.addEventListener("blur",   () => setTimeout(() => lista.style.display = "none", 150));
    document.addEventListener("click", e => {
      if (!document.getElementById("razaWrap").contains(e.target))
        lista.style.display = "none";
    });
  })();

  // ═══════════════════════════════════════════════════════════════════
  //  Cargar horas disponibles desde Firebase
  // ═══════════════════════════════════════════════════════════════════
  async function cargarHorasDisponibles(fecha) {
    const grid   = document.getElementById("horasGrid");
    const seccion = document.getElementById("seccionHoras");

    grid.innerHTML = '<span class="horas-mensaje">Consultando disponibilidad...</span>';
    seccion.style.display = "block";

    try {
      const snap = await db.ref("horas_ocupadas/" + fecha).get();
      const ocupadas = snap.exists() ? Object.values(snap.val()) : [];

      // Determinar horario segun dia de la semana
      const dia = new Date(fecha + "T12:00:00").getDay(); // usar mediodia para evitar UTC offset
      const todas = (dia === 6) ? HORARIO.sabado : HORARIO.semana;

      const libres = todas.filter(h => !ocupadas.includes(h));

      grid.innerHTML = "";

      if (libres.length === 0) {
        grid.innerHTML = '<span class="horas-mensaje">No hay horas disponibles para este dia. Prueba otra fecha.</span>';
        return;
      }

      libres.forEach(hora => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "hora-btn";
        btn.textContent = hora;
        btn.addEventListener("click", () => seleccionarHora(hora, btn));
        grid.appendChild(btn);
      });

    } catch (err) {
      grid.innerHTML = '<span class="horas-mensaje">No se pudo consultar disponibilidad. Intenta de nuevo.</span>';
      console.error("Error Firebase:", err);
    }
  }

  function seleccionarHora(hora, btn) {
    document.querySelectorAll(".hora-btn").forEach(b => b.classList.remove("selected"));
    btn.classList.add("selected");
    horaSeleccionada = hora;
  }

  // ═══════════════════════════════════════════════════════════════════
  //  Envio del formulario
  // ═══════════════════════════════════════════════════════════════════
  document.getElementById("formCita").addEventListener("submit", async function(e) {
    e.preventDefault();

    const nombre      = document.getElementById("nombre").value.trim();
    const telefono    = document.getElementById("telefono").value.trim();
    const correo      = document.getElementById("correo").value.trim();
    const nombreMascota = document.getElementById("nombreMascota").value.trim();
    const especieSelect = document.getElementById("especie").value;
    const especieOtro   = document.getElementById("especieOtro").value.trim();
    const especie       = especieSelect === "Otro" ? especieOtro : especieSelect;
    const razaInputVal  = document.getElementById("razaInput").value.trim();
    const razaOtraVal   = document.getElementById("razaOtra").value.trim();
    const raza          = razaInputVal === "Otra" ? razaOtraVal : (razaInputVal || "Mestizo");
    const sexo        = document.getElementById("sexo").value;
    const fecha         = document.getElementById("fecha").value;
    const motivo        = document.getElementById("motivo").value.trim();

    // Validacion basica
    if (!nombre || !telefono || !correo || !nombreMascota || !especie || !sexo || !fecha || !motivo) {
      mostrarMsg("Por favor completa todos los campos antes de enviar.", "error");
      return;
    }
    if (especieSelect === "Otro" && !especieOtro) {
      mostrarMsg("Por favor especifica la especie de tu mascota.", "error");
      return;
    }
    if (razaInputVal === "Otra" && !razaOtraVal) {
      mostrarMsg("Por favor especifica la raza de tu mascota.", "error");
      return;
    }
    if (!horaSeleccionada) {
      mostrarMsg("Selecciona una hora disponible.", "error");
      return;
    }

    var fechaSeleccionada = new Date(fecha + "T12:00:00");
    var manana = new Date();
    manana.setDate(manana.getDate() + 1);
    manana.setHours(0, 0, 0, 0);
    if (fechaSeleccionada < manana) {
      mostrarMsg("La fecha debe ser a partir de mañana.", "error");
      return;
    }

    const btnEnviar = document.getElementById("btnEnviar");
    btnEnviar.disabled = true;
    btnEnviar.textContent = "Enviando...";
    ocultarMsg();

    // ID unico para la solicitud en Firebase
    const id = Date.now().toString() + "_" + Math.random().toString(36).substr(2, 6);

    const solicitud = {
      nombre,
      telefono,
      correo,
      nombreMascota,
      especie,
      raza,
      sexo,
      fecha,
      hora:           horaSeleccionada,
      motivo,
      estado:         "PENDIENTE",
      fechaSolicitud: new Date().toISOString()
    };

    try {
      await db.ref("solicitudes/" + id).set(solicitud);

      // Mostrar mensaje de exito con cuenta regresiva
      let segundos = 15;
      mostrarMsg(
        "✅ ¡Tu solicitud fue enviada exitosamente! " +
        "La clínica te confirmará por correo pronto.<br/>" +
        "Volviendo al chat en <strong id='segundosRestantes'>15</strong> segundos...<br/>" +
        "<a href='index.html' style='display:inline-block;margin-top:10px;color:#2b87a0;" +
        "font-weight:700;text-decoration:none;font-size:14px;'>← Volver al chat ahora</a>",
        "success"
      );

      // Deshabilitar campos mientras corre la cuenta regresiva
      document.getElementById("formCita").querySelectorAll("input, select, textarea, button")
        .forEach(el => el.disabled = true);

      // Cuenta regresiva de 15 segundos y luego redirigir al chat
      const intervalo = setInterval(() => {
        segundos--;
        const el = document.getElementById("segundosRestantes");
        if (el) el.textContent = segundos;

        if (segundos <= 0) {
          clearInterval(intervalo);
          window.location.href = 'index.html';
        }
      }, 1000);

    } catch (err) {
      console.error("Error al enviar solicitud:", err);
      mostrarMsg(
        "Ocurrio un error al enviar tu solicitud. " +
        "Por favor llama directamente al <strong>3001234567</strong>.",
        "error"
      );
      btnEnviar.disabled = false;
      btnEnviar.textContent = "Solicitar Cita";
    }
  });

  function mostrarMsg(texto, tipo) {
    const el = document.getElementById("msgEstado");
    el.innerHTML = texto;
    el.className = "msg " + tipo;
  }

  function ocultarMsg() {
    const el = document.getElementById("msgEstado");
    el.className = "msg";
    el.innerHTML = "";
  }
</script>
</body>
</html>
