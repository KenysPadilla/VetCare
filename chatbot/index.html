<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetBot - Clínica Veterinaria VetCare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Segoe UI, Tahoma, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1f2b 0%, #1a3d52 60%, #0d1f2b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 560px;
            height: 90vh;
            max-height: 700px;
            background: #ffffff;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        .header {
            background: linear-gradient(135deg, #2b87a0, #1e6677);
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-title {
            color: white;
            font-size: 24px;
            font-weight: 800;
        }

        .header-subtitle {
            color: #a8d8e8;
            font-size: 14px;
            font-weight: 600;
        }

        .online-dot {
            margin-left: auto;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ADE80;
            box-shadow: 0 0 8px #4ADE80;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #f0f4f7;
        }

        .message {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.bot {
            justify-content: flex-start;
        }

        .message .bubble {
            max-width: 82%;
            padding: 12px 16px;
            font-size: 14px;
            line-height: 1.5;
        }

        .message.user .bubble {
            border-radius: 18px 18px 4px 18px;
            background: linear-gradient(135deg, #2b87a0, #236f86);
            color: white;
            box-shadow: 0 2px 8px rgba(43, 135, 160, 0.3);
        }

        .message.bot .bubble {
            border-radius: 18px 18px 18px 4px;
            background: #ffffff;
            color: #2D2D2D;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            border: 1px solid #e8f4f8;
        }

        .typing {
            display: flex;
            gap: 6px;
            padding: 14px 20px;
            border-radius: 18px 18px 18px 4px;
            background: #ffffff;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
            border: 1px solid #e8f4f8;
            width: fit-content;
        }

        .typing span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #2b87a0;
            opacity: 0.4;
            animation: pulse 1.2s ease-in-out infinite;
        }

        .typing span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing span:nth-child(3) {
            animation-delay: 0.4s;
        }

        .quick-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .quick-btn {
            padding: 8px 14px;
            border-radius: 20px;
            border: 1.5px solid #bee3ef;
            background: white;
            color: #2b87a0;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            font-family: Segoe UI, Tahoma, sans-serif;
            transition: all 0.2s;
        }

        .quick-btn:hover {
            background: #2b87a0;
            color: white;
            border-color: #2b87a0;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e8f4f8;
            background: white;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1.5px solid #bee3ef;
            font-size: 14px;
            font-family: Segoe UI, Tahoma, sans-serif;
            outline: none;
            background: #f0f4f7;
            transition: border-color 0.2s;
        }

        .input-area input:focus {
            border-color: #2b87a0;
        }

        .send-btn {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #2b87a0, #236f86);
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(43, 135, 160, 0.3);
            transition: all 0.2s;
        }

        .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .footer {
            text-align: center;
            padding: 8px;
            font-size: 10px;
            color: #aaa;
            background: #fafafa;
            border-top: 1px solid #f0f0f0;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.3;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #bee3ef;
            border-radius: 4px;
        }

        .cita-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            padding: 10px 20px;
            background: linear-gradient(135deg, #2b87a0, #236f86);
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            font-family: Segoe UI, Tahoma, sans-serif;
            box-shadow: 0 3px 10px rgba(43, 135, 160, 0.35);
            transition: all 0.2s;
        }

        .cita-btn:hover {
            background: linear-gradient(135deg, #1e6677, #2b87a0);
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(43, 135, 160, 0.45);
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            <div class="header-icon">
                <img src="images/logo-white.png" alt="VetCare" style="width:52px;height:52px;object-fit:contain;">
            </div>
            <div>
                <div class="header-title">Vet<span style="color:#a8d8e8;font-weight:800;">Bot</span></div>
                <div class="header-subtitle">Clínica Veterinaria VetCare &bull; En línea</div>
            </div>
            <div class="online-dot"></div>
        </div>

        <div class="messages" id="messages">
            <div class="message bot">
                <div class="bubble">¡Hola! Soy VetBot, el asistente virtual de la Clínica Veterinaria VetCare 🐾 ¿En qué
                    puedo ayudarte hoy con tu mascota?</div>
            </div>
            <div class="quick-buttons" id="quickButtons">
                <button class="quick-btn" onclick="sendQuick(this)">¿Cuándo debo vacunar a mi perro?</button>
                <button class="quick-btn" onclick="sendQuick(this)">Mi gato no quiere comer</button>
                <button class="quick-btn" onclick="sendQuick(this)">¿Qué servicios ofrecen?</button>
                <button class="quick-btn" onclick="sendQuick(this)">¿Cómo agendo una cita?</button>
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Escribe tu pregunta..."
                onkeydown="if(event.key==='Enter')sendMessage()">
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
        </div>

        <div class="footer">VetCare System © 2025 - Clínica Veterinaria VetCare</div>

    </div>

    <script>
        // ─────────────────────────────────────────────────────────────────
        // REEMPLAZA el valor de abajo con tu API Key real de Groq.
        // Obtén una gratis en: https://console.groq.com/keys
        // ─────────────────────────────────────────────────────────────────
        var API_KEY = '';

        var SYSTEM_PROMPT = 'Eres VetBot, el asistente virtual de la Clínica Veterinaria VetCare ubicada en Valledupar, Cesar, Colombia. Tu rol es ayudar a los propietarios de mascotas con información general sobre: cuidados básicos de mascotas (perros, gatos, aves, reptiles), información sobre vacunación y desparasitación, síntomas comunes y cuándo acudir al veterinario, nutrición y alimentación adecuada, servicios de la clínica (citas médicas, baño, motilada, cirugías, vacunaciones, internaciones, laboratorio). Horarios: Lunes a Viernes 8:00 AM - 6:00 PM, Sábados 8:00 AM - 1:00 PM. Dirección: Valledupar, Cesar, Colombia. Teléfono: 3001234567. Para agendar citas, indica al usuario que llame al 3001234567 o visiten la clínica. Reglas: responde siempre en español, sé amable y profesional, no diagnostiques enfermedades, recomienda siempre visitar al veterinario, mantén respuestas concisas (máximo 3-4 oraciones), si no sabes algo sugiere llamar a la clínica, puedes usar emojis ocasionalmente.';

        var conversationHistory = [];

        function addMessage(text, role) {
            var messagesDiv = document.getElementById('messages');
            var messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (role === 'user' ? 'user' : 'bot');
            messageDiv.innerHTML = '<div class="bubble">' + text + '</div>';
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addMessageWithCitaBtn(text) {
            var messagesDiv = document.getElementById('messages');
            var messageDiv = document.createElement('div');
            messageDiv.className = 'message bot';
            messageDiv.innerHTML =
                '<div class="bubble">' + text +
                '<br><a class="cita-btn" href="formulario.html" target="_blank">' +
                '📅 Ir al formulario de citas</a></div>';
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function esPreguntaDeCita(text) {
            var lower = text.toLowerCase();
            var palabras = ['cita', 'agendar', 'apartar', 'reservar', 'turno',
                            'solicitar cita', 'pedir cita', 'sacar cita', 'citas'];
            for (var i = 0; i < palabras.length; i++) {
                if (lower.indexOf(palabras[i]) !== -1) return true;
            }
            return false;
        }

        function showTyping() {
            var messagesDiv = document.getElementById('messages');
            var typingDiv = document.createElement('div');
            typingDiv.id = 'typing';
            typingDiv.className = 'message bot';
            typingDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
            messagesDiv.appendChild(typingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function hideTyping() {
            var typing = document.getElementById('typing');
            if (typing) typing.remove();
        }

        function removeQuickButtons() {
            var qb = document.getElementById('quickButtons');
            if (qb) qb.remove();
        }

        function sendToAPI(userText) {
            conversationHistory.push({ role: 'user', content: userText });

            var messages = [{ role: 'system', content: SYSTEM_PROMPT }];
            for (var i = 0; i < conversationHistory.length; i++) {
                messages.push(conversationHistory[i]);
            }

            return fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + API_KEY
                },
                body: JSON.stringify({
                    model: 'llama-3.3-70b-versatile',
                    messages: messages,
                    max_tokens: 500,
                    temperature: 0.7
                })
            })
                .then(function (response) {
                    if (!response.ok) {
                        return response.json().then(function (err) {
                            var msg = (err && err.error && err.error.message) ? err.error.message : 'Error ' + response.status;
                            throw new Error(msg);
                        });
                    }
                    return response.json();
                })
                .then(function (data) {
                    var assistantText = data.choices[0].message.content;
                    conversationHistory.push({ role: 'assistant', content: assistantText });
                    return assistantText;
                })
                .catch(function (err) {
                    var msg = err && err.message ? err.message.toLowerCase() : '';
                    if (msg.indexOf('api') !== -1 || msg.indexOf('auth') !== -1 || msg.indexOf('key') !== -1 || msg.indexOf('401') !== -1) {
                        return '⚠️ El chatbot no está disponible en este momento. Contáctanos al 3001234567.';
                    }
                    return 'Lo siento, hubo un error de conexión. Por favor intenta de nuevo o llámanos al 3001234567.';
                });
        }

        function sendMessage() {
            var input = document.getElementById('userInput');
            var text = input.value.trim();
            if (!text) return;

            input.value = '';
            input.disabled = true;
            document.getElementById('sendBtn').disabled = true;
            removeQuickButtons();

            addMessage(text, 'user');

            // Si el usuario pregunta por citas, mostrar respuesta directa + botón
            if (esPreguntaDeCita(text)) {
                showTyping();
                setTimeout(function() {
                    hideTyping();
                    addMessageWithCitaBtn(
                        '¡Claro! Puedes solicitar tu cita fácilmente desde nuestro formulario en línea. ' +
                        'Solo haz clic en el botón de abajo, completa tus datos y elige la fecha y hora disponible. ' +
                        '¡Te confirmaremos la cita por correo! 🐾'
                    );
                    input.disabled = false;
                    document.getElementById('sendBtn').disabled = false;
                    input.focus();
                }, 800);
                return;
            }

            showTyping();

            sendToAPI(text).then(function (response) {
                hideTyping();
                addMessage(response, 'bot');
                input.disabled = false;
                document.getElementById('sendBtn').disabled = false;
                input.focus();
            });
        }

        function sendQuick(btn) {
            document.getElementById('userInput').value = btn.textContent;
            sendMessage();
        }
    </script>

</body>

</html>
